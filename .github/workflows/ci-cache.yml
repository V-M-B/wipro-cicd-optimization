# Stage 1 (Phase 2): baseline + dependency caches + Docker layer cache.
# Same single sequential job and the same build/test commands as ci-baseline.yml, so the only
# difference is caching. See ADR-0006 for the stage-per-workflow experiment design.
name: ci-cache

on:
  push:
    branches: [main, "exp/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/retailops-cache

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Phase 2 / cache 1: Maven dependencies (key: hash of pom.xml)
      - name: Set up Java 21 (with Maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/orders-api/pom.xml

      # --- Phase 2 / cache 2: npm download cache (key: hash of package-lock.json)
      - name: Set up Node 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # --- Phase 2 / cache 3: pip download cache (key: hash of requirements files)
      - name: Set up Python 3.12 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/analytics/requirements*.txt

      - name: Shared schemas - verify generated code
        run: python libs/shared-schemas/codegen.py --check

      - name: orders-api - build and test
        working-directory: apps/orders-api
        run: ./mvnw -B verify

      - name: web - install
        working-directory: apps/web
        run: npm ci

      - name: web - lint and typecheck
        working-directory: apps/web
        run: npm run lint && npm run typecheck

      - name: web - unit tests with coverage
        working-directory: apps/web
        run: npm run test:coverage

      - name: web - build
        working-directory: apps/web
        run: npm run build

      # --- Phase 2 / cache 4: Playwright browser binaries (key: resolved Playwright version)
      - name: web - resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: web - restore Playwright browsers cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit

      - name: web - install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: web - install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: npx playwright install-deps chromium firefox webkit

      - name: web - e2e tests (chromium, firefox, webkit)
        working-directory: apps/web
        run: npm run e2e

      - name: analytics - install
        working-directory: apps/analytics
        run: pip install -r requirements-dev.txt

      - name: analytics - lint
        working-directory: apps/analytics
        run: ruff check .

      - name: analytics - tests with coverage
        working-directory: apps/analytics
        run: pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-cache
          path: |
            apps/orders-api/target/surefire-reports/*.xml
            apps/orders-api/target/failsafe-reports/*.xml
            apps/orders-api/target/site/jacoco*/jacoco.xml
            apps/web/reports/*.xml
            apps/web/coverage/coverage-final.json
            apps/analytics/reports/*.xml
          retention-days: 30

      # --- Phase 2 / cache 5: Docker layer cache in the GitHub Actions cache backend (BuildKit type=gha),
      # with dependency-first Dockerfile.ci so source changes reuse the dependency layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag prefix
        id: img
        run: echo "prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image orders-api
        uses: docker/build-push-action@v6
        with:
          context: apps/orders-api
          file: apps/orders-api/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.img.outputs.prefix }}-orders-api:${{ github.sha }}
          cache-from: type=gha,scope=orders-api
          cache-to: type=gha,scope=orders-api,mode=max

      - name: Build and push image web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.img.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push image analytics
        uses: docker/build-push-action@v6
        with:
          context: apps/analytics
          file: apps/analytics/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.img.outputs.prefix }}-analytics:${{ github.sha }}
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,scope=analytics,mode=max
