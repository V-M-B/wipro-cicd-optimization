# Stage 2 (Phase 3): stage 1 caching + DAG parallelization + duration-balanced sharding (shardkit).
# Runs the same tests as the baseline (no test selection yet). Images are built in parallel with the
# tests (cache warm-up) and pushed only after every test job passed. See ADR-0006.
name: ci-parallel

on:
  push:
    branches: [main, "exp/**"]
  workflow_dispatch:
    inputs:
      shards:
        description: "shard count for sharded suites (shard-count experiment)"
        required: false
        default: "2"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-parallel-${{ github.ref }}-${{ inputs.shards || '2' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/retailops-parallel
  SHARDKIT: python3 tools/shardkit/src/shardkit/cli.py

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: |
          n="${{ inputs.shards || '2' }}"
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/analytics/requirements*.txt
      - name: Shared schemas - verify generated code
        run: python libs/shared-schemas/codegen.py --check
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - name: web - lint and typecheck
        working-directory: apps/web
        run: npm run lint && npm run typecheck
      - name: analytics - lint
        run: pip install ruff==0.17.0 && ruff check apps/analytics

  orders-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/orders-api/pom.xml
      - name: orders-api - unit tests
        working-directory: apps/orders-api
        run: ./mvnw -B verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-orders-unit
          path: apps/orders-api/target/surefire-reports/*.xml
          retention-days: 30

  orders-it:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/orders-api/pom.xml
      - name: Select integration test classes (shardkit)
        id: sel
        run: |
          classes=$($SHARDKIT plan --framework junit --durations experiments/durations/orders-it.json \
            --units 'apps/orders-api/src/test/java/**/*IT.java' \
            --shards ${{ strategy.job-total }} --index ${{ matrix.shard }} --style maven --summary)
          echo "classes=$classes" >> "$GITHUB_OUTPUT"
      - name: orders-api - integration tests (shard ${{ matrix.shard }})
        if: steps.sel.outputs.classes != ''
        working-directory: apps/orders-api
        run: ./mvnw -B verify -Dtest=NoUnitTestsInThisShard -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=${{ steps.sel.outputs.classes }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-orders-it-${{ matrix.shard }}
          path: apps/orders-api/target/failsafe-reports/*.xml
          retention-days: 30

  web-unit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - name: Select test files (shardkit)
        id: sel
        run: |
          files=$($SHARDKIT plan --framework vitest --durations experiments/durations/web-unit.json \
            --units 'apps/web/src/**/*.test.ts' --units 'apps/web/src/**/*.test.tsx' --strip-prefix apps/web \
            --shards ${{ strategy.job-total }} --index ${{ matrix.shard }} --style args --summary)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: web - unit tests with coverage (shard ${{ matrix.shard }})
        if: steps.sel.outputs.files != ''
        working-directory: apps/web
        run: npx vitest run --coverage ${{ steps.sel.outputs.files }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-web-unit-${{ matrix.shard }}
          path: |
            apps/web/reports/*.xml
            apps/web/coverage/coverage-final.json
          retention-days: 30

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - name: web - build
        working-directory: apps/web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  web-e2e:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: web - e2e tests (${{ matrix.browser }})
        working-directory: apps/web
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-web-e2e-${{ matrix.browser }}
          path: apps/web/reports/*.xml
          retention-days: 30

  analytics-test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/analytics/requirements*.txt
      - name: analytics - install
        working-directory: apps/analytics
        run: pip install -r requirements-dev.txt
      - name: Select test modules (shardkit)
        id: sel
        run: |
          files=$($SHARDKIT plan --framework pytest --durations experiments/durations/analytics.json \
            --units 'apps/analytics/tests/**/test_*.py' --strip-prefix apps/analytics \
            --shards ${{ strategy.job-total }} --index ${{ matrix.shard }} --style args --summary)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: analytics - tests with coverage (shard ${{ matrix.shard }})
        if: steps.sel.outputs.files != ''
        working-directory: apps/analytics
        run: pytest ${{ steps.sel.outputs.files }} --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-analytics-${{ matrix.shard }}
          path: apps/analytics/reports/*.xml
          retention-days: 30

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [orders-api, web, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image ${{ matrix.app }} (cache warm-up, no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile.ci
          push: false
          cache-from: type=gha,scope=parallel-${{ matrix.app }}
          cache-to: type=gha,scope=parallel-${{ matrix.app }},mode=max

  publish:
    if: github.event_name == 'push'
    needs: [static-checks, orders-unit, orders-it, web-unit, web-e2e, analytics-test, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Push orders-api (from cache)
        uses: docker/build-push-action@v6
        with:
          context: apps/orders-api
          file: apps/orders-api/Dockerfile.ci
          push: true
          tags: ${{ steps.img.outputs.prefix }}-orders-api:${{ github.sha }}
          cache-from: type=gha,scope=parallel-orders-api
      - name: Push web (from cache)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile.ci
          push: true
          tags: ${{ steps.img.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=parallel-web
      - name: Push analytics (from cache)
        uses: docker/build-push-action@v6
        with:
          context: apps/analytics
          file: apps/analytics/Dockerfile.ci
          push: true
          tags: ${{ steps.img.outputs.prefix }}-analytics:${{ github.sha }}
          cache-from: type=gha,scope=parallel-analytics
