# GENERATED by scripts/gen_ephemeral.py from ci-optimized.yml - do not edit by hand.
# Stage 4 (Phase 5): stage 3 on ephemeral autoscaled ARC runners with a warm image. See ADR-0007.
name: ci-ephemeral

on:
  push:
    branches: ["exp/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-ephemeral-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/retailops-ephemeral
  SHARDKIT: env PYTHONPATH=tools/shardkit/src python3 -m shardkit.cli

jobs:
  select:
    if: vars.ARC_ENABLED == 'true'
    runs-on: arc-retailops
    timeout-minutes: 5
    outputs:
      orders_unit: ${{ steps.s.outputs.orders_unit }}
      orders_it: ${{ steps.s.outputs.orders_it }}
      orders_it_shards: ${{ steps.s.outputs.orders_it_shards }}
      web_unit: ${{ steps.s.outputs.web_unit }}
      web_unit_shards: ${{ steps.s.outputs.web_unit_shards }}
      web_e2e: ${{ steps.s.outputs.web_e2e }}
      analytics: ${{ steps.s.outputs.analytics }}
      analytics_shards: ${{ steps.s.outputs.analytics_shards }}
      images: ${{ steps.s.outputs.images }}
      static: ${{ steps.s.outputs.static }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test impact analysis
        id: s
        run: python3 scripts/ci_select.py
      - name: Record selection
        run: |
          echo "### Test selection" >> "$GITHUB_STEP_SUMMARY"
          grep '^summary=' "$GITHUB_OUTPUT" | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tia-selection
          path: tia-selection.json
          retention-days: 30

  static-checks:
    needs: select
    if: needs.select.outputs.static == 'true'
    runs-on: arc-retailops
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shared schemas - verify generated code
        run: python libs/shared-schemas/codegen.py --check
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - name: web - lint and typecheck
        working-directory: apps/web
        run: npm run lint && npm run typecheck
      - name: analytics - lint
        run: pip install ruff==0.17.0 && ruff check apps/analytics

  orders-unit:
    needs: select
    if: needs.select.outputs.orders_unit != ''
    runs-on: arc-retailops
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: orders-api - selected unit tests
        working-directory: apps/orders-api
        run: ./mvnw -B verify -DskipITs -Dsurefire.failIfNoSpecifiedTests=false -Dtest=${{ needs.select.outputs.orders_unit }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-orders-unit
          path: apps/orders-api/target/surefire-reports/*.xml
          retention-days: 30

  orders-it:
    needs: select
    if: needs.select.outputs.orders_it != ''
    runs-on: arc-retailops
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.orders_it_shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Shard selected integration tests (shardkit)
        id: sel
        run: |
          echo "${{ needs.select.outputs.orders_it }}" > units.txt
          classes=$($SHARDKIT plan --framework junit --durations experiments/durations/orders-it.json \
            --units-file units.txt --shards ${{ strategy.job-total }} --index ${{ matrix.shard }} --style maven --summary)
          echo "classes=$classes" >> "$GITHUB_OUTPUT"
      - name: orders-api - integration tests (shard ${{ matrix.shard }})
        if: steps.sel.outputs.classes != ''
        working-directory: apps/orders-api
        run: ./mvnw -B verify -Dtest=NoUnitTestsInThisShard -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=${{ steps.sel.outputs.classes }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-orders-it-${{ matrix.shard }}
          path: apps/orders-api/target/failsafe-reports/*.xml
          retention-days: 30

  web-unit:
    needs: select
    if: needs.select.outputs.web_unit != ''
    runs-on: arc-retailops
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.web_unit_shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - name: Shard selected test files (shardkit)
        id: sel
        run: |
          echo "${{ needs.select.outputs.web_unit }}" > units.txt
          files=$($SHARDKIT plan --framework vitest --durations experiments/durations/web-unit.json \
            --units-file units.txt --shards ${{ strategy.job-total }} --index ${{ matrix.shard }} --style args --summary)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: web - unit tests with coverage (shard ${{ matrix.shard }})
        if: steps.sel.outputs.files != ''
        working-directory: apps/web
        run: npx vitest run --coverage ${{ steps.sel.outputs.files }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-web-unit-${{ matrix.shard }}
          path: |
            apps/web/reports/*.xml
            apps/web/coverage/coverage-final.json
          retention-days: 30

  web-build:
    needs: select
    if: needs.select.outputs.web_e2e != '' || contains(needs.select.outputs.images, 'web')
    runs-on: arc-retailops
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - name: web - build
        working-directory: apps/web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  web-e2e:
    needs: [select, web-build]
    if: needs.select.outputs.web_e2e != ''
    runs-on: arc-retailops
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: web - install
        working-directory: apps/web
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: web - selected e2e tests (${{ matrix.browser }})
        working-directory: apps/web
        run: npx playwright test --project=${{ matrix.browser }} ${{ needs.select.outputs.web_e2e }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-web-e2e-${{ matrix.browser }}
          path: apps/web/reports/*.xml
          retention-days: 30

  analytics-test:
    needs: select
    if: needs.select.outputs.analytics != ''
    runs-on: arc-retailops
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.analytics_shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: analytics - install
        working-directory: apps/analytics
        run: pip install -r requirements-dev.txt
      - name: Shard selected test modules (shardkit)
        id: sel
        run: |
          echo "${{ needs.select.outputs.analytics }}" > units.txt
          files=$($SHARDKIT plan --framework pytest --durations experiments/durations/analytics.json \
            --units-file units.txt --shards ${{ strategy.job-total }} --index ${{ matrix.shard }} --style args --summary)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: analytics - tests with coverage (shard ${{ matrix.shard }})
        if: steps.sel.outputs.files != ''
        working-directory: apps/analytics
        run: pytest ${{ steps.sel.outputs.files }} --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-analytics-${{ matrix.shard }}
          path: apps/analytics/reports/*.xml
          retention-days: 30

  images:
    needs: select
    if: needs.select.outputs.images != '[]'
    runs-on: arc-retailops
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image ${{ matrix.app }} (cache warm-up, no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile.ci
          push: false
          cache-from: type=gha,scope=ephemeral-${{ matrix.app }}
          cache-to: type=gha,scope=ephemeral-${{ matrix.app }},mode=max

  publish:
    needs: [select, static-checks, orders-unit, orders-it, web-unit, web-e2e, analytics-test, images]
    if: >-
      always() && github.event_name != 'pull_request' && needs.select.outputs.images != '[]' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: arc-retailops
    timeout-minutes: 15
    strategy:
      matrix:
        app: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Push ${{ matrix.app }} (from cache)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile.ci
          push: true
          tags: ${{ steps.img.outputs.prefix }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=ephemeral-${{ matrix.app }}
