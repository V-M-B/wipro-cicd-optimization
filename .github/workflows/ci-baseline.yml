# Baseline "legacy" pipeline. Intentionally conventional: one sequential job,
# no dependency or Docker layer caching, no path filters, every test on every push,
# every image rebuilt and pushed. FROZEN after tag baseline-v1 (see ADR-0002).
name: ci-baseline

on:
  push:
    branches: [main, "exp/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/retailops

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shared schemas - verify generated code
        run: python libs/shared-schemas/codegen.py --check

      - name: orders-api - build and test
        working-directory: apps/orders-api
        run: ./mvnw -B verify

      - name: web - install
        working-directory: apps/web
        run: npm ci

      - name: web - lint and typecheck
        working-directory: apps/web
        run: npm run lint && npm run typecheck

      - name: web - unit tests with coverage
        working-directory: apps/web
        run: npm run test:coverage

      - name: web - build
        working-directory: apps/web
        run: npm run build

      - name: web - install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: web - e2e tests (chromium, firefox, webkit)
        working-directory: apps/web
        run: npm run e2e

      - name: analytics - install
        working-directory: apps/analytics
        run: pip install -r requirements-dev.txt

      - name: analytics - lint
        working-directory: apps/analytics
        run: ruff check .

      - name: analytics - tests with coverage
        working-directory: apps/analytics
        run: pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-baseline
          path: |
            apps/orders-api/target/surefire-reports/*.xml
            apps/orders-api/target/failsafe-reports/*.xml
            apps/orders-api/target/site/jacoco*/jacoco.xml
            apps/web/reports/*.xml
            apps/web/coverage/coverage-final.json
            apps/analytics/reports/*.xml
          retention-days: 30

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build images
        run: |
          prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          for app in orders-api web analytics; do
            docker build -t "$prefix-$app:${GITHUB_SHA}" "apps/$app"
          done

      - name: Push images
        if: github.event_name == 'push'
        run: |
          prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          for app in orders-api web analytics; do
            docker push "$prefix-$app:${GITHUB_SHA}"
          done
