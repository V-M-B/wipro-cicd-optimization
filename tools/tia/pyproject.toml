[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tia"
version = "0.1.0"
description = "Test impact analysis: static dependency graphs, dynamic coverage maps and safety rules"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.scripts]
tia = "tia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
