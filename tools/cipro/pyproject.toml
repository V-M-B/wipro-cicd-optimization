[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipro"
version = "0.1.0"
description = "CI profiler: pull GitHub Actions run/job/step timings into SQLite, find waste, compare pipelines."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.scripts]
cipro = "cipro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cipro = ["pricing.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
