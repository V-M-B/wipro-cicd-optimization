# Helm values for gha-runner-scale-set (ARC 0.15.0). Installed by infra/arc/setup.sh / setup.ps1.
# githubConfigUrl and githubConfigSecret are passed on the command line.
runnerScaleSetName: arc-retailops
minRunners: 0          # scale to zero when idle
maxRunners: 6          # bounded by the laptop: 16 CPUs / ~20 GB given to Docker Desktop
containerMode:
  type: dind           # Docker-in-Docker sidecar for image builds and Testcontainers (ADR-0007)
template:
  spec:
    containers:
      - name: runner
        image: retailops-runner:local
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        resources:
          requests: {cpu: "2", memory: "2Gi"}
