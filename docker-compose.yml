services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports: ["5432:5432"]
  orders-api:
    build: apps/orders-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
    ports: ["8080:8080"]
    depends_on: [postgres]
  analytics:
    build: apps/analytics
    ports: ["8000:8000"]
  web:
    build: apps/web
    ports: ["3000:80"]
