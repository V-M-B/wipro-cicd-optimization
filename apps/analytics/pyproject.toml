[project]
name = "retailops-analytics"
version = "0.1.0"
description = "RetailOps analytics service: retail sales analytics over the shared schemas"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit2"
addopts = "-ra --strict-markers"
markers = [
    "slow: data-heavy tests over large generated datasets (20k-100k orders)",
]
filterwarnings = [
    "error",
    # starlette>=1.x prefers httpx2 for TestClient; httpx is the dependency fixed by the project plan
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/generated/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/generated", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
